services:
  - type: web
    name: nutrition-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: DATABASE_URL
        sync: false
      - key: APP_ACCESS_KEY
        sync: false
      - key: MCP_API_KEY
        sync: false
      - key: NOTION_TOKEN
        sync: false
      - key: NOTION_DATABASE_ID
        sync: false
      - key: NOTION_TITLE_PROPERTY
        sync: false
      - key: NOTION_CALENDAR_PROPERTY
        sync: false
